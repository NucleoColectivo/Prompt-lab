<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background chassis -->
  <rect width="64" height="64" rx="14" fill="#101014"/>
  <rect x="2" y="2" width="60" height="60" rx="12" stroke="#F8C300" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Antenna -->
  <line x1="32" y1="10" x2="32" y2="18" stroke="#F4F2ED" stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="32" cy="9.5" r="4" fill="#F8C300"/>

  <!-- Side ear sensors -->
  <rect x="8" y="29" width="5" height="12" rx="2.5" fill="#326BFF"/>
  <rect x="51" y="29" width="5" height="12" rx="2.5" fill="#326BFF"/>

  <!-- Robot head -->
  <rect x="13" y="18" width="38" height="33" rx="9" fill="#F4F2ED"/>

  <!-- Visor screen -->
  <rect x="18" y="24" width="28" height="15" rx="5.5" fill="#101014"/>

  <!-- Glowing robot eyes -->
  <circle cx="25.5" cy="31.5" r="3.5" fill="#F8C300"/>
  <circle cx="38.5" cy="31.5" r="3.5" fill="#F8C300"/>
  <circle cx="26.5" cy="30.5" r="1" fill="#FFFDF5"/>
  <circle cx="39.5" cy="30.5" r="1" fill="#FFFDF5"/>

  <!-- Geometric mouth bar -->
  <rect x="24" y="43.5" width="16" height="3.2" rx="1.6" fill="#101014"/>
  <rect x="27" y="44.3" width="4" height="1.6" rx="0.8" fill="#326BFF"/>
  <rect x="33" y="44.3" width="4" height="1.6" rx="0.8" fill="#7545D6"/>
</svg>
